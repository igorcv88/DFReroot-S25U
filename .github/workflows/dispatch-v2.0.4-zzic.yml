name: Dispatch 2.0.4-zzic release

on:
  push:
    branches:
      - release-trigger-v2.0.4-zzic

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag=v2.0.4-zzic \
            -f prerelease=false
