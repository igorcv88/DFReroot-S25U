name: Companion review build (EXPERIMENTAL)

# Builds ONE signed, installable companion APK for physical review.
#
# It is not a release. Nothing is published, no tag is created, and the main
# release workflow is untouched: adding the companion as a third release
# artifact is a separate owner decision, to be taken only after a positive
# physical attestation and PR C (docs/COMPANION.md §6).
#
# The APK is signed with the SAME key as DFReroot and DFInstaller, because the
# companion's Binder caller check compares the caller's signing certificate
# against its own - a differently-signed companion refuses every request from
# DFReroot, which is the gate working and a miserable thing to debug on a phone.
#
# Required repository secrets (the same four the release workflow uses):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#
# WHY THIS IS MANUAL AND BRANCH-RESTRICTED: it holds the production signing
# secrets. A workflow that signs with them must never run code that has not been
# reviewed and merged, so this one refuses any ref but the default branch - a
# pull-request head, a fork, or an arbitrary feature branch cannot reach the key
# through it. The owner's instruction, 2026-11-12.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note recorded in the provenance (e.g. what is being tested)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  review-build:
    name: Signed companion APK for physical review
    runs-on: ubuntu-latest
    steps:
      - name: Refuse any ref but the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # The signing secrets are available to this job. Only integrated,
          # reviewed code may reach them.
          # An empty default_branch would make the comparison pass by accident,
          # which is the one failure mode this check must not have.
          [ -n "$DEFAULT_BRANCH" ] || DEFAULT_BRANCH=main
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::This workflow signs with the production key and runs" \
                 "only on refs/heads/$DEFAULT_BRANCH (got $REF). Merge the" \
                 "change first."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # repro_report.sh uses git describe

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # RESOLVE sdkmanager; do not assume it is on PATH.
      #
      # The first dispatch of this workflow failed with
      # `sdkmanager: command not found`, and this repository had already paid
      # for that lesson: release.yml carries the same resolution, with the note
      # that a run once used `cmdline-tools/16.0/bin/sdkmanager`, so a fallback
      # that only knows `latest` turns a PATH miss into "not found" on a runner
      # that has the binary. This is that logic, reused rather than re-invented.
      - name: Install Android SDK packages
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK" || { echo "::error::neither ANDROID_SDK_ROOT nor ANDROID_HOME is set"; exit 1; }
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" \
                     $(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -rV) \
                     "$SDK/tools/bin/sdkmanager"; do
              [ -x "$c" ] && { SDKMANAGER="$c"; break; }
            done
          fi
          test -n "${SDKMANAGER:-}" && test -x "$SDKMANAGER" || {
            echo "::error::sdkmanager not found under $SDK or on PATH"
            ls -la "$SDK/cmdline-tools" 2>/dev/null || true
            exit 1
          }
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          # What "installed" has to mean here: the two binaries this job calls
          # by name later. A directory is too weak a check - a half-unpacked
          # archive leaves one behind with nothing usable in it.
          test -n "$(find "$SDK/build-tools" -name apksigner -print -quit)" \
            || { echo "::error::apksigner missing after install"; exit 1; }
          test -n "$(find "$SDK/build-tools" -name aapt2 -print -quit)" \
            || { echo "::error::aapt2 missing after install"; exit 1; }
          echo "ANDROID_SDK_RESOLVED=$SDK" >> "$GITHUB_ENV"

      # The companion has NO native code, so the pinned NDK is deliberately not
      # installed: a 1 GB download and its retry logic buy nothing here. If
      # configuring :app (which does declare externalNativeBuild) needs an NDK
      # to be nameable, whatever the runner already ships satisfies that - and
      # it must never be used to build :app for a release, which is what
      # release.yml's pinned, verified install exists for. Absent is fine; this
      # step does not fail on it.
      - name: Point at an NDK if the runner has one (not pinned, not for :app)
        run: |
          set -eu
          SDK="${ANDROID_SDK_RESOLVED:?}"
          NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -rV | head -1 || true)"
          if [ -n "$NDK" ]; then
            echo "using the runner's $NDK for configuration only"
            echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          else
            echo "no NDK on this runner; the companion does not need one"
          fi

      # Offline gates first. A signed artefact built from a tree whose own
      # invariants do not hold is worse than no artefact: it installs.
      - name: Offline gates for the companion
        run: |
          sh tools/tests/run_tests.sh
          sh tools/tests/run_installer_tests.sh
          python3 tools/profile_binding_audit.py

      - name: Derive a version for this review build
        run: |
          # Absence is a refusal everywhere else in this repo; a review build is
          # not a release, so it gets an explicit, unmistakable pair rather than
          # a borrowed release version. The name says what it is.
          SHORT="$(git rev-parse --short HEAD)"
          echo "DFR_VERSION_NAME=0.0.0-companion-review-$SHORT" >> "$GITHUB_ENV"
          echo "DFR_VERSION_CODE=1" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set; an unsigned companion is" \
                 "useless here - the Binder check compares certificates."
            exit 1
          fi
          # Outside the working tree, so it can never be packaged.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed companion APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :companion:assembleRelease
          mkdir -p review
          cp companion/build/outputs/apk/release/companion-release.apk \
             review/df_companion-review.apk

      # The certificate fingerprint is the whole point of signing this with the
      # production key: DFReroot's installed build must match it, or every
      # transaction is refused. So it is recorded, not assumed.
      - name: Record the certificate fingerprint and provenance
        env:
          NOTE: ${{ inputs.note }}
        run: |
          APKSIGNER="$(find "$ANDROID_SDK_RESOLVED/build-tools" -name apksigner | sort | tail -1)"
          test -x "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          AAPT2="$(find "$ANDROID_SDK_RESOLVED/build-tools" -name aapt2 | sort | tail -1)"
          {
            echo "# DFR Companion - review build provenance"
            echo
            echo "STATUS            : EXPERIMENTAL - NOT PHYSICALLY QUALIFIED"
            echo "PUBLISHED         : no (not a release artefact; see docs/COMPANION.md section 6)"
            echo
            echo "commit            : $(git rev-parse HEAD)"
            echo "describe          : $(git describe --tags --always --dirty)"
            echo "ref               : $GITHUB_REF"
            echo "workflow run      : $GITHUB_RUN_ID"
            echo "built at          : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "dirty files       : $(git status --porcelain | wc -l)"
            [ -n "$NOTE" ] && echo "note              : $NOTE"
            echo
            echo "## Artefact"
            echo "apk               : df_companion-review.apk"
            echo "size              : $(stat -c%s review/df_companion-review.apk) bytes"
            echo "sha256            : $(sha256sum review/df_companion-review.apk | cut -d' ' -f1)"
            echo "package / version :" \
                 "$("$AAPT2" dump badging review/df_companion-review.apk | grep -m1 '^package:')"
            echo
            echo "## Signing certificate (must match the installed DFReroot build)"
            "$APKSIGNER" verify --print-certs review/df_companion-review.apk \
              | sed 's/^/  /'
            echo
            echo "## What this build is NOT"
            echo "  - not qualified physically: no device has run it"
            echo "  - not a root grant: the owner grants it explicitly with"
            echo "    ksud profile grant com.polygraphene.df.companion"
            echo "  - not connected to DFReroot: the app does not call it until PR C"
            echo "  - limited to TX_DESCRIBE and TX_ATTEST; there is no root command channel"
          } > review/build-provenance.txt
          cat review/build-provenance.txt

      - name: SHA256SUMS
        run: |
          cd review
          sha256sum df_companion-review.apk build-provenance.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload the review bundle
        uses: actions/upload-artifact@v4
        with:
          name: df_companion-review-EXPERIMENTAL-NOT-QUALIFIED
          path: review/
          if-no-files-found: error
          retention-days: 30
