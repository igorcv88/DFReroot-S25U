name: Build ZZIC DirtyFrag LKM

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_RELEASE: 6.6.127-android15-8-p33f4ffe-abogkiS938BXXUCZZIC-4k
  DDK_IMAGE: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
  OUT_NAME: dirtyfrag-android15-6.6-S938BXXUCZZIC.ko

jobs:
  build:
    name: Build and audit exact ZZIC DirtyFrag LKM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show source revision
        run: |
          set -euo pipefail

          echo "repository=$GITHUB_REPOSITORY"
          echo "sha=$GITHUB_SHA"
          git log -1 --oneline

      - name: Validate committed Gate G evidence
        run: |
          set -euo pipefail

          test -s evidence/zzic/gate-g/ZZIC-derived-minimal.symvers
          test -s evidence/zzic/gate-g/ZZIC-modversion-provenance.json

          echo "=== ZZIC DERIVED SYMVERS ==="
          cat evidence/zzic/gate-g/ZZIC-derived-minimal.symvers

          echo
          echo "=== REQUIRED CRCs ==="

          python3 - <<'PY'
          from pathlib import Path

          path = Path("evidence/zzic/gate-g/ZZIC-derived-minimal.symvers")

          required = {
              "__stack_chk_fail": 0xf0fdf6cb,
              "_printk":          0x92997ed8,
              "memset":           0xdcb764ad,
              "sprint_symbol":    0x661601de,
          }

          got = {}

          for line in path.read_text().splitlines():
              fields = line.split()

              if len(fields) < 2:
                  continue

              try:
                  crc = int(fields[0], 16)
              except ValueError:
                  continue

              symbol = fields[1]

              if symbol in required:
                  got[symbol] = crc & 0xffffffff

          if set(got) != set(required):
              raise SystemExit(
                  f"Required symbol set mismatch: "
                  f"got={sorted(got)} expected={sorted(required)}"
              )

          for symbol in sorted(required):
              if got[symbol] != required[symbol]:
                  raise SystemExit(
                      f"{symbol}: CRC mismatch: "
                      f"got=0x{got[symbol]:08x} "
                      f"expected=0x{required[symbol]:08x}"
                  )

              print(f"{symbol:20s} 0x{got[symbol]:08x}")

          print("Gate G committed CRC evidence: PASS")
          PY

      - name: Prepare output directory
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/dirtyfrag-out"
          mkdir -p "$RUNNER_TEMP/dirtyfrag-out"

      - name: Pull exact DDK image
        run: |
          set -euo pipefail

          docker pull "$DDK_IMAGE"

          docker image inspect "$DDK_IMAGE" \
            --format 'image={{index .RepoDigests 0}}'

      - name: Build exact ZZIC DirtyFrag module
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$RUNNER_TEMP/dirtyfrag-out:/out" \
            -e TARGET_RELEASE="$TARGET_RELEASE" \
            -e OUT_NAME="$OUT_NAME" \
            "$DDK_IMAGE" \
            bash -lc '
              set -euo pipefail

              export PATH="$(ls -d /opt/ddk/clang/*/bin | head -1):$PATH"
              export ARCH=arm64
              export LLVM=1
              export LLVM_IAS=1

              echo "=== BUILD ENVIRONMENT ==="
              echo "TARGET_RELEASE=$TARGET_RELEASE"
              echo "KDIR=${KDIR:-<unset>}"
              echo "clang=$(command -v clang)"
              clang --version | head -3

              test -n "${KDIR:-}"
              test -d "$KDIR"
              test -s "$KDIR/Module.symvers"

              EXACT=/work/evidence/zzic/gate-g/ZZIC-derived-minimal.symvers

              test -s "$EXACT"

              echo
              echo "=== TARGET ==="
              echo "$TARGET_RELEASE"

              echo
              echo "=== EXACT ZZIC CRC EVIDENCE ==="
              cat "$EXACT"

              #
              # Force exact ZZIC kernel release into the external module.
              #
              mkdir -p \
                "$KDIR/include/config" \
                "$KDIR/include/generated"

              printf "%s\n" "$TARGET_RELEASE" \
                > "$KDIR/include/config/kernel.release"

              printf "#define UTS_RELEASE \"%s\"\n" "$TARGET_RELEASE" \
                > "$KDIR/include/generated/utsrelease.h"

              echo
              echo "=== ORIGINAL DDK SYMBOL ENTRIES ==="

              grep -E \
                "[[:space:]](__stack_chk_fail|_printk|memset|sprint_symbol)[[:space:]]" \
                "$KDIR/Module.symvers" || true

              #
              # Patch the DDK table with the derived ZZIC CRCs using the tool this
              # repo already has, not a second copy of the same logic inline here.
              #
              # tools/patch_symvers_crcs.py is unit-tested (row shape preserved
              # for 4- and 5-field tables, refusals for a missing symbol, a
              # duplicate, a non-record line) and - the reason it matters - it
              # DEMANDS the provenance record for the derived table, exactly as
              # ko_audit.py does. An inline reimplementation is a second door
              # into those CRCs with no gate on it.
              #
              cp "$KDIR/Module.symvers" "$KDIR/Module.symvers.ddk.bak"

              python3 /work/tools/patch_symvers_crcs.py \
                --base "$KDIR/Module.symvers.ddk.bak" \
                --derived "$EXACT" \
                --provenance /work/evidence/zzic/gate-g/ZZIC-modversion-provenance.json \
                --out "$KDIR/Module.symvers"

              echo
              echo "=== EFFECTIVE KDIR ENTRIES ==="

              grep -E \
                "[[:space:]](__stack_chk_fail|_printk|memset|sprint_symbol)[[:space:]]" \
                "$KDIR/Module.symvers"

              echo
              echo "=== EFFECTIVE ENTRIES WITH TABS VISIBLE ==="

              grep -E \
                "[[:space:]](__stack_chk_fail|_printk|memset|sprint_symbol)[[:space:]]" \
                "$KDIR/Module.symvers" \
                | cat -A

              echo
              echo "=== EFFECTIVE CRC SELF-CHECK ==="

              python3 - "$KDIR/Module.symvers" <<'"'"'PY'"'"'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          expected = {
              "__stack_chk_fail": 0xf0fdf6cb,
              "_printk":          0x92997ed8,
              "memset":           0xdcb764ad,
              "sprint_symbol":    0x661601de,
          }

          got = {}

          for line in path.read_text().splitlines():
              fields = line.split()

              if len(fields) < 2:
                  continue

              if fields[1] not in expected:
                  continue

              got[fields[1]] = int(fields[0], 16) & 0xffffffff

          if set(got) != set(expected):
              raise SystemExit(
                  f"effective symbol set mismatch: {sorted(got)}"
              )

          for symbol in sorted(expected):
              if got[symbol] != expected[symbol]:
                  raise SystemExit(
                      f"{symbol}: effective CRC is "
                      f"0x{got[symbol]:08x}, expected "
                      f"0x{expected[symbol]:08x}"
                  )

              print(
                  f"{symbol:20s} "
                  f"0x{got[symbol]:08x} PASS"
              )
          PY

              echo
              echo "=== MODVERSION CONFIG ==="

              if [ -f "$KDIR/include/config/auto.conf" ]; then
                grep -E \
                  "^(CONFIG_MODVERSIONS|CONFIG_BASIC_MODVERSIONS|CONFIG_EXTENDED_MODVERSIONS|CONFIG_RUST)=" \
                  "$KDIR/include/config/auto.conf" || true
              else
                echo "auto.conf not present"
              fi

              echo
              echo "=== MODPOST MODE SUPPORT ==="

              grep -R \
                -E "CONFIG_(BASIC|EXTENDED)_MODVERSIONS" \
                /opt/ddk/src/android15-6.6/scripts/Makefile.modpost \
                /opt/ddk/src/android15-6.6/scripts/mod 2>/dev/null \
                | head -100 || true

              #
              # Clean only the external DirtyFrag module tree.
              #
              cd /work/dirtyfrag-lkm

              make -C "$KDIR" \
                M="$PWD" \
                ARCH=arm64 \
                LLVM=1 \
                clean || true

              echo
              echo "=== BUILD ==="

              #
              # Exactly what dirtyfrag-lkm/Makefile does, plus V=1.
              #
              # What was here before also passed src="$PWD", LLVM_IAS=1 and
              # CONFIG_{BASIC,EXTENDED}_MODVERSIONS, and produced a module whose
              # __versions section existed with size 0 - no entries, and no
              # modpost warning either.
              #
              #   src is an INTERNAL kbuild variable. A make command-line
              #   assignment overrides it everywhere, including in
              #   scripts/Makefile.modpost, which is what computes the symbol
              #   dump modpost reads. Overriding it is the leading suspect for
              #   modpost resolving nothing while staying silent.
              #
              #   CONFIG_BASIC_MODVERSIONS / CONFIG_EXTENDED_MODVERSIONS do not
              #   exist in 6.6: the MODPOST MODE SUPPORT probe above found no
              #   reference to either in the scripts of this tree. They were
              #   noise.
              #
              #   LLVM_IAS=1 is the default on 6.6 and dirtyfrag-lkm/Makefile does
              #   not pass it.
              #
              # V=1 makes the actual modpost invocation visible, so if
              # __versions is still empty the command line that produced it is
              # in the log rather than guessed at.
              #
              make -C "$KDIR" \
                M="$PWD" \
                ARCH=arm64 \
                LLVM=1 \
                CONFIG_MODVERSIONS=y \
                V=1 \
                modules \
                -j"$(nproc)"

              test -s dirtyfrag.ko

              echo
              echo "=== PRE-STRIP ELF ==="

              readelf -h dirtyfrag.ko \
                | grep -F "AArch64"

              strings dirtyfrag.ko \
                | grep -F "$TARGET_RELEASE"

              echo
              echo "=== PRE-STRIP VERSION SECTIONS ==="

              readelf -SW dirtyfrag.ko \
                | grep -E \
                  "__versions|__version_ext_names|__version_ext_crcs" \
                || true

              echo
              echo "=== MODPOST SYMBOL RESOLUTION ==="

              #
              # Diagnose at the cause. The previous run produced a __versions
              # section of size 0, which means modpost emitted the section and no
              # entries: for each import it either did not find the symbol in the
              # dump (s->module NULL) or found it without a CRC. Failing here,
              # naming which, beats failing in ko_audit three steps later with
              # only the consequence visible.
              #
              echo "module-local symvers written by this build:"
              cat Module.symvers || echo "  (none)"

              echo
              echo "kernel symvers modpost should have read:"
              wc -l < "$KDIR/Module.symvers"

              echo
              echo "generated __versions array in dirtyfrag.mod.c:"
              sed -n "/__versions/,/};/p" dirtyfrag.mod.c || true

              #
              # Read the section size with the ELF parser this repo already has,
              # not awk over readelf, which prints a single-digit section index
              # as "[ 8]",
              # which splits into two fields and shifts every column, and the size
              # is column 6 rather than 7. Getting that wrong would report a
              # populated table as empty, or worse, the reverse.
              #
              VERS_SIZE=$(
                PYTHONPATH=/work/tools python3 -c "import elf64; s = elf64.ELF64('"'"'dirtyfrag.ko'"'"').section('"'"'__versions'"'"'); print(-1 if s is None else s.size)"
              )

              echo
              echo "__versions size = $VERS_SIZE bytes (-1 = section absent)"

              if [ "$VERS_SIZE" -le 0 ]; then
                echo "::error::modpost produced an EMPTY __versions table. The"
                echo "::error::module cannot load on a CONFIG_MODVERSIONS kernel:"
                echo "::error::check_version() refuses when the table exists but"
                echo "::error::names no version for a symbol it is resolving, and"
                echo "::error::CONFIG_MODULE_FORCE_LOAD is not set on ZZIC."
                echo "::error::The modpost command line is above under V=1, and"
                echo "::error::the generated dirtyfrag.mod.c array is printed"
                echo "::error::just above - read those two before changing flags."
                exit 1
              fi

              echo "__versions is populated."

              echo
              echo "=== PRE-STRIP MODINFO ==="

              modinfo dirtyfrag.ko || true

              echo
              echo "=== PRE-STRIP SHA256 ==="

              sha256sum dirtyfrag.ko

              echo
              echo "=== PRE-STRIP STRICT GATE G ==="

              python3 /work/tools/ko_audit.py dirtyfrag.ko \
                --symvers /work/evidence/zzic/gate-g/ZZIC-derived-minimal.symvers \
                --symvers-provenance /work/evidence/zzic/gate-g/ZZIC-modversion-provenance.json \
                --require-modversion-coverage

              echo
              echo "=== PRE-STRIP GATE G PASS ==="

              #
              # Keep the exact unstripped module for diagnosis/provenance.
              #
              cp \
                dirtyfrag.ko \
                "/out/${OUT_NAME%.ko}-unstripped.ko"

              #
              # For this validation build use --strip-debug rather than
              # --strip-unneeded.
              #
              # This isolates whether stripping could remove load-critical
              # modversion data.
              #
              llvm-objcopy \
                --strip-debug \
                -R .comment \
                -R .note.gnu.build-id \
                -R .note.gnu.property \
                -R .note.Linux \
                -R .note.GNU-stack \
                -R .BTF \
                -R .BTF.base \
                -R .llvm_addrsig \
                -R .hyp.text \
                -R .hyp.bss \
                -R .hyp.rodata \
                -R .hyp.event_ids \
                -R .hyp.patchable_function_entries \
                -R .hyp.data \
                dirtyfrag.ko \
                "/out/$OUT_NAME"

              test -s "/out/$OUT_NAME"

              echo
              echo "=== FINAL MODULE ==="

              readelf -h "/out/$OUT_NAME" \
                | grep -F "AArch64"

              strings "/out/$OUT_NAME" \
                | grep -F "$TARGET_RELEASE"

              echo
              echo "=== FINAL VERSION SECTIONS ==="

              readelf -SW "/out/$OUT_NAME" \
                | grep -E \
                  "__versions|__version_ext_names|__version_ext_crcs" \
                || true

              echo
              echo "=== FINAL MODINFO ==="

              modinfo "/out/$OUT_NAME" || true

              echo
              echo "=== FINAL SHA256 ==="

              sha256sum "/out/$OUT_NAME"

              echo
              echo "=== FINAL SIZE ==="

              stat -c \
                "%n %s bytes" \
                "/out/$OUT_NAME"
            '

      - name: Gate G strict audit
        run: |
          set -euo pipefail

          KO="$RUNNER_TEMP/dirtyfrag-out/$OUT_NAME"

          test -s "$KO"

          python3 tools/ko_audit.py "$KO" \
            --symvers evidence/zzic/gate-g/ZZIC-derived-minimal.symvers \
            --symvers-provenance evidence/zzic/gate-g/ZZIC-modversion-provenance.json \
            --require-modversion-coverage

      - name: Gate G JSON audit record
        run: |
          set -euo pipefail

          KO="$RUNNER_TEMP/dirtyfrag-out/$OUT_NAME"

          python3 tools/ko_audit.py "$KO" \
            --symvers evidence/zzic/gate-g/ZZIC-derived-minimal.symvers \
            --symvers-provenance evidence/zzic/gate-g/ZZIC-modversion-provenance.json \
            --require-modversion-coverage \
            --json \
            > "$RUNNER_TEMP/dirtyfrag-out/$OUT_NAME.audit.json"

          test -s \
            "$RUNNER_TEMP/dirtyfrag-out/$OUT_NAME.audit.json"

      - name: Record final artifact identity
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/dirtyfrag-out"

          sha256sum "$OUT_NAME" \
            | tee "$OUT_NAME.sha256"

          sha256sum \
            "${OUT_NAME%.ko}-unstripped.ko" \
            | tee \
              "${OUT_NAME%.ko}-unstripped.ko.sha256"

          echo
          echo "=== FINAL ARTIFACT ==="

          stat -c \
            "filename=%n size=%s bytes" \
            "$OUT_NAME"

          echo
          echo "=== FINAL SHA256 ==="

          cat "$OUT_NAME.sha256"

          echo
          echo "=== UNSTRIPPED SHA256 ==="

          cat "${OUT_NAME%.ko}-unstripped.ko.sha256"

          echo
          echo "=== EXPECTED TARGET RELEASE ==="

          echo "$TARGET_RELEASE"

      - name: Upload ZZIC DirtyFrag artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zzic-dirtyfrag-lkm
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/dirtyfrag-out/${{ env.OUT_NAME }}
            ${{ runner.temp }}/dirtyfrag-out/${{ env.OUT_NAME }}.sha256
            ${{ runner.temp }}/dirtyfrag-out/${{ env.OUT_NAME }}.audit.json
            ${{ runner.temp }}/dirtyfrag-out/dirtyfrag-android15-6.6-S938BXXUCZZIC-unstripped.ko
            ${{ runner.temp }}/dirtyfrag-out/dirtyfrag-android15-6.6-S938BXXUCZZIC-unstripped.ko.sha256
