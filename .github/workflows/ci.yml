name: CI

# Host-side checks only. None of these prove hardware compatibility: they prove
# the fail-closed logic, the offline audits and the build still hold. The gate
# matrix in docs/S25U_ZZIC_COMPATIBILITY.md is the authority on what is actually
# verified on the ZZIC device.
#
# Runs on every pull request to catch regressions before merge. Release builds
# remain separately gated and signed only by the manual release workflow.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Drop obsolete PR runs when new commits arrive; manual release is unaffected.
concurrency:
  group: dfreroot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Offline gates (no device, no SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate A - target profile unit + regression tests
        run: sh tools/tests/run_tests.sh

      # The packages.xml write path, driven against an in-memory filesystem so
      # the EPERM-then-rename branch that lost the file's metadata on hardware
      # is covered by a test rather than by the next field run.
      - name: Gate H - installer SafeWrite regression suite
        run: sh tools/tests/run_installer_tests.sh

      - name: Release tag resolution tests (stubbed gh, no network)
        run: sh tools/tests/test_resolve_release_tag.sh

      - name: Profile / module binding invariant (ZZIC)
        run: python3 tools/profile_binding_audit.py

      - name: Profile / module binding invariant (DZIF)
        run: python3 tools/dzif_profile_binding_audit.py

      # Also reproduces the OWO vbmeta digest from the committed blobs and
      # compares the signed vendor descriptor against the live dm-verity
      # table, so a half-corrected copy of the OXM profile fails here.
      - name: Profile / module / AVB binding invariant (DZIF-OWO)
        run: python3 tools/dzif_owo_profile_binding_audit.py

      # Compileall alone cannot catch a release note generator that silently
      # omits a newly supported exact profile. Exercise the actual generator,
      # bind its OWO values to the JSON pins and insist on honest physical state.
      # Also keep release.yml's signing path behind the same OWO audit as CI.
      - name: Generated release notes and signed-release OWO gate
        run: |
          python3 tools/release_notes.py > "$RUNNER_TEMP/compatibility-notes.md"
          python3 - "$RUNNER_TEMP/compatibility-notes.md" <<'PY'
          import json
          import pathlib
          import sys
          import yaml

          notes = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          heading = "### DZIF/OWO exact-target state"
          if notes.count(heading) != 1:
              raise SystemExit("OWO release notes section missing or duplicated")
          section = notes.split(heading, 1)[1].split("### Early Integrated Root", 1)[0]
          p = json.loads(pathlib.Path("tools/dzif_owo_profile.json").read_text())
          expected = (
              p["fingerprint"],
              p["vbmeta_digest"][:16],
              p["ko_sha256"][:16],
              p["ksud_sha256"][:16],
              "**PRIOR GATE 3 FAIL; NEW DAEMON NOT YET QUALIFIED**",
              "**NOT ESTABLISHED**",
          )
          for value in expected:
              if value not in section:
                  raise SystemExit("OWO release notes missing: " + value)

          release = yaml.safe_load(pathlib.Path(".github/workflows/release.yml").read_text())
          steps = release["jobs"]["release"]["steps"]
          gate = "python3 tools/dzif_owo_profile_binding_audit.py"
          if not any(step.get("run") == gate for step in steps):
              raise SystemExit("signed Release lacks the OWO profile/AVB/daemon gate")
          print("OWO release notes and signed-release gate: PASS")
          PY

      - name: Python tool syntax
        run: python3 -m compileall -q tools

      # A workflow that does not parse fails with zero jobs and no log, which is
      # how a broken release.yml would first be discovered: at publish time. This
      # step cannot save a broken ci.yml (nothing would run it), but it does keep
      # the release workflow honest.
      - name: Workflow YAML parses
        run: |
          python3 - <<'PY'
          import sys, yaml
          rc = 0
          for f in ("ci.yml", "release.yml", "companion-review-build.yml"):
              p = ".github/workflows/" + f
              try:
                  d = yaml.safe_load(open(p))
              except Exception as e:
                  print("[x] %s does not parse: %s" % (p, e)); rc = 1; continue
              jobs = (d or {}).get("jobs") or {}
              if not jobs:
                  print("[x] %s declares no jobs" % p); rc = 1; continue
              for jn, j in jobs.items():
                  for i, s in enumerate(j.get("steps") or []):
                      if not (s.get("name") or s.get("uses")):
                          print("[x] %s: %s step %d has no name" % (p, jn, i)); rc = 1
              print("ok  %s (%s)" % (p, ", ".join(jobs)))
          sys.exit(rc)
          PY

      # No ZZIC filesystem here, so this can only report UNVERIFIED. Running it
      # anyway keeps the Gate F tool itself exercised: it returned 0
      # unconditionally until it was given a real verdict, and a tool that cannot
      # fail is not a gate.
      - name: Gate F - userspace ELF audit tool (no artefacts, expect UNVERIFIED)
        run: python3 tools/elf_audit.py

      - name: Shell script syntax
        run: |
          # `sh -n "$s" && echo ...` would swallow a failure: on the left of &&
          # the runner's `set -e` does not terminate the step, and the loop's
          # status is that of its LAST iteration, so an early syntax error left
          # the step green. Run the check as a bare command.
          for s in build.sh build-splice.sh create-keystore.sh \
                   tools/ci_build_audit.sh tools/repro_report.sh \
                   tools/tests/run_tests.sh tools/zzic_collect.sh \
                   tools/tests/run_installer_tests.sh \
                   tools/tests/exp_syntax_check.sh \
                   tools/resolve_release_tag.sh \
                   tools/tests/test_resolve_release_tag.sh \
                   dirtyfrag-lkm/build.sh; do
            sh -n "$s"
            echo "ok  $s"
          done

      - name: Gate G - bundled kernel module ABI audit
        run: |
          set -euo pipefail

          ZZIC_KO="app/src/main/jni/dirtyfrag-android15-6.6-S938BXXUCZZIC.ko"
          DZIF_KO="app/src/main/jni/dirtyfrag-android15-6.6-S938BXXUCDZIF.ko"

          test -s "$ZZIC_KO"
          test -s "$DZIF_KO"

          for ko in app/src/main/jni/dirtyfrag-android*.ko; do
            [ "$ko" = "$ZZIC_KO" ] && continue
            [ "$ko" = "$DZIF_KO" ] && continue
            echo "### $ko"
            python3 tools/ko_audit.py "$ko"
          done

          echo "### $ZZIC_KO (strict ZZIC acceptance)"
          python3 tools/ko_audit.py "$ZZIC_KO" \
            --symvers evidence/zzic/gate-g/ZZIC-derived-minimal.symvers \
            --symvers-provenance evidence/zzic/gate-g/ZZIC-modversion-provenance.json \
            --require-modversion-coverage

          echo "### $DZIF_KO (strict DZIF acceptance)"
          python3 tools/ko_audit.py "$DZIF_KO" \
            --symvers evidence/dzif/gate-g/DZIF-derived-minimal.symvers \
            --symvers-provenance evidence/dzif/gate-g/DZIF-modversion-provenance.json \
            --target-profile-json tools/dzif_profile.json \
            --require-modversion-coverage

      - name: Gate H - installer round-trip on a synthetic packages.xml
        run: |
          cat > /tmp/packages.xml <<'XML'
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <packages>
            <shared-user name="android.uid.system" userId="1000">
              <sigs count="1">
                <cert index="0" key="30820122300d06092a864886f70d01010105000382010f00" />
              </sigs>
            </shared-user>
            <package name="com.example.app" codePath="/data/app/example" userId="10123">
              <sigs count="1"><cert index="0" /></sigs>
            </package>
          </packages>
          XML
          python3 tools/installer_audit.py /tmp/packages.xml

  build:
    name: Gate E - build + native packaging audit
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages on hosted runner
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Export NDK location
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          test -d "$NDK" || { echo "NDK missing at $NDK"; exit 1; }
          echo "ANDROID_NDK=$NDK"      >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      # CI has no release key: generate a throwaway one so the compile path is
      # exercised. These APKs are NOT publishable - a release build must be
      # signed with the real keystore (see release.yml), because DFInstaller
      # injects DFReroot's certificate into packages.xml.
      - name: Throwaway signing key (build check only)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 1 -alias dfreroot \
            -storepass citestonly -keypass citestonly -dname "CN=dfreroot-ci-throwaway"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/ci.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=citestonly"      >> "$GITHUB_ENV"
          echo "KEY_ALIAS=dfreroot"                >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=citestonly"           >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      - name: Native packaging audit
        run: ./tools/ci_build_audit.sh

      - name: Build provenance record
        run: ./tools/repro_report.sh
