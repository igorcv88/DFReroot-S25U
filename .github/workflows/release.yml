name: Release

# Builds the signed release APKs and publishes them as GitHub Release assets.
#
# No workflow artifacts are uploaded: the Release itself is the only output.
#
# Required repository secrets:
#   KEYSTORE_BASE64    base64 of the JKS/PKCS12 keystore (`base64 -w0 keystore.jks`)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       key password
#
# DFReroot and DFInstaller are signed with the SAME key on purpose: DFInstaller
# writes DFReroot's certificate into packages.xml, so a mismatch makes the
# injected key useless. Both modules read the four values above (see
# app/build.gradle.kts), so one keystore covers both.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.0.6-zzic). LEAVE EMPTY to bump the latest tag automatically.'
        required: false
        type: string
      prerelease:
        description: 'Mark as a pre-release instead of the stable/latest release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # repro_report.sh uses git describe

      # A release must describe the commit that was actually built. On a manual
      # dispatch the checkout is at the dispatched ref, which need not be the
      # target of the tag being published, so publishing would attach these
      # artifacts to a different commit's release. Refuse instead, and do it
      # before spending a signed build.
      - name: Resolve the version and validate the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version is DERIVED, not read out of the tree: nothing in the
          # repository names a version any more. An empty tag box bumps the patch
          # of the greatest existing tag; an explicit tag (or a tag push) names the
          # version, and the APKs take their versionName/versionCode from it.
          # tools/resolve_release_version.sh owns the rule and is unit-tested
          # off-CI. Its output is TAG/VER/VERSION_CODE/VERSION_SOURCE.
          #
          # fetch-depth: 0 above fetched the tags, so the bump is computed against
          # what is actually published.
          git tag -l > "$RUNNER_TEMP/tags"
          sh tools/resolve_release_version.sh "${{ inputs.tag }}" \
              "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$RUNNER_TEMP/tags" \
              > "$RUNNER_TEMP/version"
          cat "$RUNNER_TEMP/version"
          . "$RUNNER_TEMP/version"

          # tools/resolve_release_tag.sh owns the question of whether publishing
          # TAG from this commit is safe, and is unit-tested off-CI
          # (tools/tests/test_resolve_release_tag.sh). It is run AGAIN immediately
          # before publishing, because the tag can appear during the several
          # minutes this build takes.
          #
          # The fourth argument compares the tag against the version being built.
          # That used to be the guard against a hand-edited versionName the
          # dispatcher forgot; now the two come from one derivation, so it is a
          # WIRING check - it fails if this step and the injection below ever stop
          # describing one version. It costs nothing and runs before any build.
          sh tools/resolve_release_tag.sh "$GITHUB_REPOSITORY" "$TAG" "$GITHUB_SHA" "$VER" \
            >> "$GITHUB_ENV"

          # The pair both modules compile from (root build.gradle.kts refuses if
          # either is absent rather than defaulting to something publishable).
          {
            echo "VER=$VER"
            echo "TAG=$TAG"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "DFR_VERSION_NAME=$VER"
            echo "DFR_VERSION_CODE=$VERSION_CODE"
          } >> "$GITHUB_ENV"

      # `cache: gradle` caches ~/.gradle/caches and ~/.gradle/wrapper, which is
      # where the two things this build re-downloads every run live: the Gradle
      # DISTRIBUTION the wrapper fetches, and every dependency AGP and the Kotlin
      # plugin resolve.
      #
      # Why here and why only this: runs 34 and 36 were measured step by step
      # (2m48s vs 5m40s of job time), and the delta is three roughly equal
      # chunks - +50 s in `Set up Android SDK`, +50 s in `Build signed APKs`, and
      # +67 s between the last step finishing and the job being marked complete.
      # The first of those installs the same four pinned packages on every
      # commit, so its inputs are identical across the two runs and its slowdown
      # is environmental by construction; the last is GitHub's own teardown. The
      # repository had no caching of any kind, so both download-bound steps run
      # at whatever the network gives that day - which is also why the floor
      # across runs 23-36 is 2m46s and the ceiling 5m44s.
      #
      # This is therefore not a fix for a regression - there was none in the
      # workflow - it removes one of the two variable downloads from the critical
      # path. A cache miss behaves exactly as today.
      #
      # The SDK/NDK is deliberately NOT cached here. The NDK is the single
      # largest download, but restoring ~1 GB from the Actions cache is not
      # obviously faster than fetching it, it would occupy a tenth of the
      # repository's 10 GB cache budget, and it is the toolchain that produces
      # signed artefacts. Measure that one before trading it.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1

      # The NDK is installed separately, and retried, because it is the one
      # package whose download can fail this way. On 2026-10-14 a release run
      # died here:
      #
      #   Warning: An error occurred while preparing SDK package
      #   NDK (Side by side) 27.0.12077973: Error on ZipFile unknown archive.
      #   Error: The process '.../sdkmanager' failed with exit code 1
      #
      # `unknown archive` is sdkmanager reporting that what it downloaded is not
      # a valid zip - a truncated transfer or an error page in place of the
      # payload. At ~1 GB the NDK is several times the size of the other three
      # packages combined, so it is where a partial transfer actually lands, and
      # one bad byte range takes the whole run with it: this step precedes the
      # offline gates and the signed build, so nothing at all gets produced.
      #
      # Three attempts, with the partial state cleared between them, because a
      # retry that re-reads the same corrupt cached zip is not a retry. The
      # install is left to `sdkmanager` directly rather than to the action,
      # which exposes no retry and fails the job on the first attempt.
      #
      # This is a transport fix only. The version stays pinned to the toolchain
      # AGENTS.md §6 records as known-good; a run that cannot obtain THAT NDK
      # fails, and does not fall back to the runner's preinstalled one.
      - name: Install the pinned NDK
        run: |
          set -eu
          NDK_VER=27.0.12077973
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VER"
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }

          attempt=1
          while :; do
            echo "::group::NDK $NDK_VER install attempt $attempt"
            if yes | "$SDKMANAGER" --install "ndk;$NDK_VER"; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" -ge 3 ]; then
              echo "NDK $NDK_VER could not be installed in $attempt attempts"
              exit 1
            fi
            # Clear what a failed attempt leaves behind. Without this the next
            # attempt can re-read the same corrupt archive and fail identically,
            # which is the failure mode this step exists to break.
            rm -rf "$NDK_DIR" \
                   "$ANDROID_SDK_ROOT/.temp" \
                   "$ANDROID_SDK_ROOT/.downloadIntermediates" \
                   "$HOME/.android/cache" || true
            attempt=$((attempt + 1))
            sleep $((attempt * 10))
          done

      - name: Export NDK location
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          # `test -d` was too weak for the failure that just happened: a
          # half-unpacked archive can leave the directory in place with no
          # toolchain in it, and the build would then fail later, further from
          # the cause. Check the binary the build actually invokes, and the
          # source.properties sdkmanager writes only on a completed install.
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          for f in "$NDK/source.properties" "$CLANG"; do
            test -e "$f" || { echo "NDK incomplete: missing $f"; exit 1; }
          done
          test -x "$CLANG" || { echo "NDK incomplete: $CLANG not executable"; exit 1; }
          "$CLANG" --version | head -1
          echo "ANDROID_NDK=$NDK"      >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      # --- gates that do not need a device, before spending a build on it ---
      # CI is manual-only now, so these are the gates. They run before the signed
      # build so a logic regression costs seconds, not a whole build.
      - name: Gate A - target profile unit + regression tests
        run: sh tools/tests/run_tests.sh

      # The packages.xml write path, driven against an in-memory filesystem so
      # the EPERM-then-rename branch that lost the file's metadata on hardware
      # is covered by a test rather than by the next field run.
      - name: Gate H - installer SafeWrite regression suite
        run: sh tools/tests/run_installer_tests.sh

      - name: Release tag resolution tests (stubbed gh, no network)
        run: sh tools/tests/test_resolve_release_tag.sh

      - name: Profile / module binding invariant (ZZIC)
        run: python3 tools/profile_binding_audit.py

      - name: Profile / module binding invariant (DZIF)
        run: python3 tools/dzif_profile_binding_audit.py

      - name: Gate F - userspace ELF audit tool (no artefacts, expect UNVERIFIED)
        run: python3 tools/elf_audit.py

      # Re-derives ro.boot.vbmeta.digest from the committed vbmeta blobs and
      # compares it to the value both profiles pin. Costs no extra runner: it
      # runs inside the offline gate set that already precedes the signed build.
      - name: Gate B - /vendor AVB provenance, reproduced from committed blobs
        run: python3 tools/verify_zzic_avb.py

      - name: Gate H - installer round-trip on a synthetic packages.xml
        run: |
          cat > "$RUNNER_TEMP/packages.xml" <<'XML'
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <packages>
            <shared-user name="android.uid.system" userId="1000">
              <sigs count="1">
                <cert index="0" key="30820122300d06092a864886f70d01010105000382010f00" />
              </sigs>
            </shared-user>
            <package name="com.example.app" codePath="/data/app/example" userId="10123">
              <sigs count="1"><cert index="0" /></sigs>
            </package>
          </packages>
          XML
          python3 tools/installer_audit.py "$RUNNER_TEMP/packages.xml"

      - name: Python tool syntax
        run: python3 -m compileall -q tools

      # The release notes are generated from the profile. If that generator is
      # broken, find out here and not while publishing.
      - name: Release notes generate from the profile
        run: python3 tools/release_notes.py

      - name: Shell script syntax
        run: |
          for s in build.sh build-splice.sh create-keystore.sh \
                   tools/ci_build_audit.sh tools/repro_report.sh \
                   tools/tests/run_tests.sh tools/zzic_collect.sh \
                   tools/tests/run_installer_tests.sh \
                   tools/tests/exp_syntax_check.sh \
                   tools/resolve_release_tag.sh \
                   tools/resolve_release_version.sh \
                   tools/tests/test_resolve_release_tag.sh \
                   dirtyfrag-lkm/build.sh; do
            sh -n "$s"
            echo "ok  $s"
          done

      - name: Gate G - bundled kernel module ABI audit
        run: |
          set -euo pipefail

          ZZIC_KO="app/src/main/jni/dirtyfrag-android15-6.6-S938BXXUCZZIC.ko"
          DZIF_KO="app/src/main/jni/dirtyfrag-android15-6.6-S938BXXUCDZIF.ko"

          test -s "$ZZIC_KO"
          test -s "$DZIF_KO"

          # Generic family modules keep their normal structural audit. Exact
          # firmware-bound images are deliberately excluded and audited below
          # against their own provenance-bound CRC tables with full coverage.
          for ko in app/src/main/jni/dirtyfrag-android*.ko; do
            [ "$ko" = "$ZZIC_KO" ] && continue
            [ "$ko" = "$DZIF_KO" ] && continue
            echo "### $ko"
            python3 tools/ko_audit.py "$ko"
          done

          echo "### $ZZIC_KO (strict ZZIC acceptance)"
          python3 tools/ko_audit.py "$ZZIC_KO" \
            --symvers evidence/zzic/gate-g/ZZIC-derived-minimal.symvers \
            --symvers-provenance evidence/zzic/gate-g/ZZIC-modversion-provenance.json \
            --require-modversion-coverage

          echo "### $DZIF_KO (strict DZIF acceptance)"
          python3 tools/ko_audit.py "$DZIF_KO" \
            --symvers evidence/dzif/gate-g/DZIF-derived-minimal.symvers \
            --symvers-provenance evidence/dzif/gate-g/DZIF-modversion-provenance.json \
            --target-profile-json tools/dzif_profile.json \
            --require-modversion-coverage

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; a release build cannot be signed."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Keep the keystore OUT of the working tree so it can never be packaged.
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build.sh

      - name: Gate E - native packaging audit
        run: ./tools/ci_build_audit.sh

      # The injection is only fail-closed if somebody checks it arrived. Gradle
      # refuses an absent DFR_VERSION_NAME/DFR_VERSION_CODE, but a stale export,
      # a renamed variable or a module that stopped reading the shared value would
      # all produce a perfectly good APK carrying the WRONG identity - published
      # under a filename and a tag that say otherwise, and binding Auto Root
      # qualification to a versionCode that never shipped. So read the identity
      # back out of the artifacts and compare it to what this run resolved.
      - name: Verify both APKs carry the derived version
        run: |
          AAPT2="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 | sort | tail -1)"
          test -x "$AAPT2" || { echo "::error::aapt2 not found"; exit 1; }
          rc=0
          for apk in df_reroot.apk df_installer.apk; do
            line=$("$AAPT2" dump badging "$apk" | grep -m1 '^package:')
            code=$(printf '%s' "$line" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
            name=$(printf '%s' "$line" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            echo "$apk: versionCode=$code versionName=$name"
            if [ "$code" != "$VERSION_CODE" ] || [ "$name" != "$VER" ]; then
              echo "::error::$apk carries $name ($code) but this run publishes" \
                   "$VER ($VERSION_CODE) under tag $TAG."
              rc=1
            fi
          done
          exit $rc

      - name: Verify APK signature and identity
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)"
          for apk in df_reroot.apk df_installer.apk; do
            echo "### $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done
          # Both APKs must carry the same certificate, or the injected key is useless.
          a=$("$APKSIGNER" verify --print-certs df_reroot.apk    | grep -i 'SHA-256 digest' | head -1)
          b=$("$APKSIGNER" verify --print-certs df_installer.apk | grep -i 'SHA-256 digest' | head -1)
          test -n "$a" && test "$a" = "$b" || {
            echo "::error::df_reroot.apk and df_installer.apk are signed with different keys"; exit 1; }

      - name: Build provenance record
        run: ./tools/repro_report.sh | tee build-provenance.txt

      - name: Name and checksum the release assets
        run: |
          mkdir -p release
          cp df_reroot.apk        "release/df_reroot_${VER}.apk"
          cp df_installer.apk     "release/df_installer_${VER}.apk"
          cp build-provenance.txt release/build-provenance.txt
          cd release
          sha256sum df_reroot_*.apk df_installer_*.apk build-provenance.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## DFReroot ${VER} — Galaxy S25 Ultra SM-S938B / ZZIC + DZIF exact profiles"
            echo
            echo "Install \`df_installer_${VER}.apk\` first; \`df_reroot_${VER}.apk\` is also"
            echo "bundled inside it, so it does not need to be sideloaded separately."
            echo
            # Generated from tools/zzic_profile.json and the binding audit, never
            # hand-maintained here: the v2.0.2 notes described two blockers the
            # build had already cleared, because prose cannot notice a profile change.
            python3 tools/release_notes.py
            echo "### Checksums"
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
            echo
            echo "Build provenance (toolchain, commit, payload hashes) is attached as"
            echo "\`build-provenance.txt\`."
          } > release-notes.md

          # Re-validate the tag NOW, not just before the build. The earlier check
          # is several minutes stale: another manual run selecting the same absent
          # tag, or any actor creating it meanwhile, would leave this run happily
          # taking the update path and overwriting that release's assets with a
          # build of a different commit. `gh release create --target` does not
          # protect against this either - it only affects tag creation when no
          # matching tag exists yet. So ask again, and refuse if the answer changed.
          #
          # This is a check, not a lock: nothing here can reserve a ref. It closes
          # the window from minutes to the gap between this call and the publish
          # below, which is the best a non-atomic API allows.
          sh tools/resolve_release_tag.sh "$GITHUB_REPOSITORY" "$TAG" "$GITHUB_SHA" "$VER" \
            > "$RUNNER_TEMP/tagstate"
          cat "$RUNNER_TEMP/tagstate"
          . "$RUNNER_TEMP/tagstate"   # refreshes TAG_EXISTS for this step

          # Resolve the prerelease policy ONCE, before the create/update split.
          # `inputs.prerelease` is empty on a tag push (inputs only exist for
          # workflow_dispatch), and an empty value must mean the DECLARED default.
          #
          # That default is FALSE by owner policy: releases are published as the
          # stable/latest release, and the compatibility state is communicated by
          # the generated notes (tools/release_notes.py), which state every gate
          # and say plainly when the build will refuse. The flag never carried
          # that information anyway - the fail-closed gates in the APK do, and
          # they are unaffected by how GitHub labels the release. Pre-release is
          # now an explicit, deliberate choice, not the default.
          PRERELEASE="${{ inputs.prerelease }}"
          [ -n "$PRERELEASE" ] || PRERELEASE=false
          echo "publishing $TAG (prerelease=$PRERELEASE)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # --clobber only replaces assets of the SAME name, so a version bump
            # would otherwise leave the previous version's APKs sitting in the
            # release next to the new ones. Drop any APK we are not re-uploading.
            for old in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              case "$old" in
                *.apk)
                  if [ ! -f "release/$old" ]; then
                    echo "removing stale asset $old"
                    gh release delete-asset "$TAG" "$old" -y
                  fi
                  ;;
              esac
            done
            gh release upload "$TAG" release/* --clobber
            # The prerelease state must be applied on the UPDATE path too. Editing
            # only the notes leaves a release that was previously published as full
            # - exactly the state the old tag-push default produced - sitting there
            # as full for ever, and makes a manual dispatch unable to correct it.
            gh release edit "$TAG" \
              --notes-file release-notes.md \
              --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" release/* \
              --title "DFReroot ${VER} (${TAG})" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              --prerelease="$PRERELEASE"
          fi
