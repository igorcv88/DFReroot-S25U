name: Release

# Builds the signed release APKs and publishes them as GitHub Release assets.
#
# No workflow artifacts are uploaded: the Release itself is the only output.
#
# Required repository secrets:
#   KEYSTORE_BASE64    base64 of the JKS/PKCS12 keystore (`base64 -w0 keystore.jks`)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       key password
#
# DFReroot and DFInstaller are signed with the SAME key on purpose: DFInstaller
# writes DFReroot's certificate into packages.xml, so a mismatch makes the
# injected key useless. Both modules read the four values above (see
# app/build.gradle.kts), so one keystore covers both.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create/publish (e.g. v2.0.2). Defaults to the current ref.'
        required: false
        type: string
      prerelease:
        description: 'Mark as a pre-release instead of the stable/latest release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # repro_report.sh uses git describe

      # A release must describe the commit that was actually built. On a manual
      # dispatch the checkout is at the dispatched ref, which need not be the
      # target of the tag being published, so publishing would attach these
      # artifacts to a different commit's release. Refuse instead, and do it
      # before spending a signed build.
      - name: Resolve and validate the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          # WHICH tag this run publishes. On a tag push GITHUB_REF_NAME is the
          # tag; on a workflow_dispatch it is the BRANCH, so the old
          # `[ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"` resolved an empty tag box
          # to `main` - and `gh release create main` would have created a tag named
          # after the default branch. tools/resolve_dispatch_tag.sh owns the rule
          # and is unit-tested off-CI (8 cases).
          TAG=$(sh tools/resolve_dispatch_tag.sh \
                  "${{ inputs.tag }}" "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$VER")
          test -n "$TAG" || { echo "::error::no tag to publish"; exit 1; }
          echo "publishing tag $TAG for versionName $VER"

          # tools/resolve_release_tag.sh owns this decision and is unit-tested
          # off-CI (tools/tests/test_resolve_release_tag.sh, 21 cases). It is run
          # AGAIN immediately before publishing, because the tag can appear during
          # the several minutes this build takes.
          # The fourth argument makes the resolver refuse a tag that does not
          # spell this tree's versionName. Both are read here and nowhere else,
          # so without it a dispatch could publish v2.0.5-zzic with 2.0.4-zzic
          # APKs inside - and it would do so only after spending the build.
          sh tools/resolve_release_tag.sh "$GITHUB_REPOSITORY" "$TAG" "$GITHUB_SHA" "$VER" \
            >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            ndk;27.0.12077973
            cmake;3.22.1

      - name: Export NDK location
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          test -d "$NDK" || { echo "NDK missing at $NDK"; exit 1; }
          echo "ANDROID_NDK=$NDK"      >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      # --- gates that do not need a device, before spending a build on it ---
      # CI is manual-only now, so these are the gates. They run before the signed
      # build so a logic regression costs seconds, not a whole build.
      - name: Gate A - target profile unit + regression tests
        run: sh tools/tests/run_tests.sh

      # The packages.xml write path, driven against an in-memory filesystem so
      # the EPERM-then-rename branch that lost the file's metadata on hardware
      # is covered by a test rather than by the next field run.
      - name: Gate H - installer SafeWrite regression suite
        run: sh tools/tests/run_installer_tests.sh

      - name: Release tag resolution tests (stubbed gh, no network)
        run: sh tools/tests/test_resolve_release_tag.sh

      - name: Profile / module binding invariant (dossier section 39)
        run: python3 tools/profile_binding_audit.py

      - name: Gate F - userspace ELF audit tool (no artefacts, expect UNVERIFIED)
        run: python3 tools/elf_audit.py

      # Re-derives ro.boot.vbmeta.digest from the committed vbmeta blobs and
      # compares it to the value both profiles pin. Costs no extra runner: it
      # runs inside the offline gate set that already precedes the signed build.
      - name: Gate B - /vendor AVB provenance, reproduced from committed blobs
        run: python3 tools/verify_zzic_avb.py

      - name: Gate H - installer round-trip on a synthetic packages.xml
        run: |
          cat > "$RUNNER_TEMP/packages.xml" <<'XML'
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <packages>
            <shared-user name="android.uid.system" userId="1000">
              <sigs count="1">
                <cert index="0" key="30820122300d06092a864886f70d01010105000382010f00" />
              </sigs>
            </shared-user>
            <package name="com.example.app" codePath="/data/app/example" userId="10123">
              <sigs count="1"><cert index="0" /></sigs>
            </package>
          </packages>
          XML
          python3 tools/installer_audit.py "$RUNNER_TEMP/packages.xml"

      - name: Python tool syntax
        run: python3 -m compileall -q tools

      # The release notes are generated from the profile. If that generator is
      # broken, find out here and not while publishing.
      - name: Release notes generate from the profile
        run: python3 tools/release_notes.py

      - name: Shell script syntax
        run: |
          for s in build.sh build-splice.sh create-keystore.sh \
                   tools/ci_build_audit.sh tools/repro_report.sh \
                   tools/tests/run_tests.sh tools/zzic_collect.sh \
                   tools/tests/run_installer_tests.sh \
                   tools/tests/exp_syntax_check.sh \
                   tools/resolve_release_tag.sh \
                   tools/resolve_dispatch_tag.sh \
                   tools/tests/test_resolve_release_tag.sh \
                   dirtyfrag-lkm/build.sh; do
            sh -n "$s"
            echo "ok  $s"
          done

      - name: Gate G - bundled kernel module ABI audit
        run: |
          set -euo pipefail

          ZZIC_KO="app/src/main/jni/dirtyfrag-android15-6.6-S938BXXUCZZIC.ko"

          test -s "$ZZIC_KO"

          # Generic family modules keep their normal structural audit. The exact
          # ZZIC image is deliberately excluded here and audited below against
          # the provenance-bound target CRC table with mandatory full coverage.
          for ko in app/src/main/jni/dirtyfrag-android*.ko; do
            [ "$ko" = "$ZZIC_KO" ] && continue
            echo "### $ko"
            python3 tools/ko_audit.py "$ko"
          done

          echo "### $ZZIC_KO (strict ZZIC acceptance)"
          python3 tools/ko_audit.py "$ZZIC_KO" \
            --symvers evidence/zzic/gate-g/ZZIC-derived-minimal.symvers \
            --symvers-provenance evidence/zzic/gate-g/ZZIC-modversion-provenance.json \
            --require-modversion-coverage

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; a release build cannot be signed."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Keep the keystore OUT of the working tree so it can never be packaged.
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build.sh

      - name: Gate E - native packaging audit
        run: ./tools/ci_build_audit.sh

      - name: Verify APK signature and identity
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)"
          for apk in df_reroot.apk df_installer.apk; do
            echo "### $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done
          # Both APKs must carry the same certificate, or the injected key is useless.
          a=$("$APKSIGNER" verify --print-certs df_reroot.apk    | grep -i 'SHA-256 digest' | head -1)
          b=$("$APKSIGNER" verify --print-certs df_installer.apk | grep -i 'SHA-256 digest' | head -1)
          test -n "$a" && test "$a" = "$b" || {
            echo "::error::df_reroot.apk and df_installer.apk are signed with different keys"; exit 1; }

      - name: Build provenance record
        run: ./tools/repro_report.sh | tee build-provenance.txt

      - name: Name and checksum the release assets
        run: |
          mkdir -p release
          cp df_reroot.apk        "release/df_reroot_${VER}.apk"
          cp df_installer.apk     "release/df_installer_${VER}.apk"
          cp build-provenance.txt release/build-provenance.txt
          cd release
          sha256sum df_reroot_*.apk df_installer_*.apk build-provenance.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## DFReroot ${VER} — Galaxy S25 Ultra SM-S938B / S938BXXUCZZIC"
            echo
            echo "Install \`df_installer_${VER}.apk\` first; \`df_reroot_${VER}.apk\` is also"
            echo "bundled inside it, so it does not need to be sideloaded separately."
            echo
            # Generated from tools/zzic_profile.json and the binding audit, never
            # hand-maintained here: the v2.0.2 notes described two blockers the
            # build had already cleared, because prose cannot notice a profile change.
            python3 tools/release_notes.py
            echo "### Checksums"
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
            echo
            echo "Build provenance (toolchain, commit, payload hashes) is attached as"
            echo "\`build-provenance.txt\`."
          } > release-notes.md

          # Re-validate the tag NOW, not just before the build. The earlier check
          # is several minutes stale: another manual run selecting the same absent
          # tag, or any actor creating it meanwhile, would leave this run happily
          # taking the update path and overwriting that release's assets with a
          # build of a different commit. `gh release create --target` does not
          # protect against this either - it only affects tag creation when no
          # matching tag exists yet. So ask again, and refuse if the answer changed.
          #
          # This is a check, not a lock: nothing here can reserve a ref. It closes
          # the window from minutes to the gap between this call and the publish
          # below, which is the best a non-atomic API allows.
          sh tools/resolve_release_tag.sh "$GITHUB_REPOSITORY" "$TAG" "$GITHUB_SHA" "$VER" \
            > "$RUNNER_TEMP/tagstate"
          cat "$RUNNER_TEMP/tagstate"
          . "$RUNNER_TEMP/tagstate"   # refreshes TAG_EXISTS for this step

          # Resolve the prerelease policy ONCE, before the create/update split.
          # `inputs.prerelease` is empty on a tag push (inputs only exist for
          # workflow_dispatch), and an empty value must mean the DECLARED default.
          #
          # That default is FALSE by owner policy: releases are published as the
          # stable/latest release, and the compatibility state is communicated by
          # the generated notes (tools/release_notes.py), which state every gate
          # and say plainly when the build will refuse. The flag never carried
          # that information anyway - the fail-closed gates in the APK do, and
          # they are unaffected by how GitHub labels the release. Pre-release is
          # now an explicit, deliberate choice, not the default.
          PRERELEASE="${{ inputs.prerelease }}"
          [ -n "$PRERELEASE" ] || PRERELEASE=false
          echo "publishing $TAG (prerelease=$PRERELEASE)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # --clobber only replaces assets of the SAME name, so a version bump
            # would otherwise leave the previous version's APKs sitting in the
            # release next to the new ones. Drop any APK we are not re-uploading.
            for old in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              case "$old" in
                *.apk)
                  if [ ! -f "release/$old" ]; then
                    echo "removing stale asset $old"
                    gh release delete-asset "$TAG" "$old" -y
                  fi
                  ;;
              esac
            done
            gh release upload "$TAG" release/* --clobber
            # The prerelease state must be applied on the UPDATE path too. Editing
            # only the notes leaves a release that was previously published as full
            # - exactly the state the old tag-push default produced - sitting there
            # as full for ever, and makes a manual dispatch unable to correct it.
            gh release edit "$TAG" \
              --notes-file release-notes.md \
              --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" release/* \
              --title "DFReroot ${VER} (${TAG})" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              --prerelease="$PRERELEASE"
          fi
